name: ruka-dev APK

on:
  push:
    branches:
      - ruka-dev
  workflow_dispatch:

concurrency:
  group: ruka-dev-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_and_publish_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free up disk space
        uses: ./.github/actions/free_up_space
        with:
          target: apk

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare release signing key
        env:
          RUKA_DEV_KEYSTORE: ${{ secrets.RUKA_DEV_KEYSTORE }}
          RUKA_DEV_KEYSTORE_PASS: ${{ secrets.RUKA_DEV_KEYSTORE_PASS }}
        run: |
          echo "$RUKA_DEV_KEYSTORE" | base64 -d > android/ruka-dev.keystore
          cat > android/key.properties <<EOF
          storePassword=$RUKA_DEV_KEYSTORE_PASS
          keyPassword=$RUKA_DEV_KEYSTORE_PASS
          keyAlias=rukadev
          storeFile=../ruka-dev.keystore
          EOF

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm,android-arm64

      - name: Rename APK
        run: cp build/app/outputs/apk/release/app-release.apk fluffychat-ruka-dev.apk

      - name: Publish APK to ruka-dev release
        uses: softprops/action-gh-release@v3
        with:
          name: ruka-dev
          tag_name: ruka-dev
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: fluffychat-ruka-dev.apk
